name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: Test API
        run: npm run test:api

      - name: Test web
        run: npm run test:web

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build API container
        run: >-
          docker build
          --file apps/api/Dockerfile
          --build-arg BUILD_REVISION=${{ github.sha }}
          --tag agentic-accounting-api:${{ github.sha }}
          .

      - name: Build web container
        run: >-
          docker build
          --file apps/web/Dockerfile
          --build-arg BUILD_REVISION=${{ github.sha }}
          --build-arg VITE_DEFAULT_API_BASE_URL=https://api.nexiuslabs.com
          --tag agentic-accounting-web:${{ github.sha }}
          .

  db-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentic_accounting_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_accounting_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run disposable DB smoke tests
        run: npm run test:db
